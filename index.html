<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Happy Birthday!</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         OPENING SCREEN
         ========================================= -->

    <section
        id="openingScreen"
        class="screen opening-screen"
    >

        <div class="opening-content">

            <p class="eyebrow">
                A little surprise for you
            </p>

            <h1>
                Happy Birthday!
            </h1>

            <p class="subtitle">
                Tonight is all about you.
            </p>

            <button
                id="startButton"
                class="main-button"
            >
                Open Your Birthday Surprise
            </button>

        </div>

    </section>



    <!-- =========================================
         BIRTHDAY SCREEN
         ========================================= -->

    <section
        id="birthdayScreen"
        class="screen birthday-screen"
    >

        <div class="birthday-content">


            <!-- TEXT -->

            <div class="intro-area">

                <p>
                    Your special night begins...
                </p>

            </div>



            <!-- CAKE -->

            <div class="cake-area">

                <div class="cake">


                    <!-- CANDLE 1 -->

                    <div class="candle candle-left">

                        <div class="flame"></div>

                    </div>


                    <!-- CANDLE 2 -->

                    <div class="candle candle-center">

                        <div class="flame"></div>

                    </div>


                    <!-- CANDLE 3 -->

                    <div class="candle candle-right">

                        <div class="flame"></div>

                    </div>



                    <!-- CAKE FROSTING -->

                    <div class="cake-top">

                        <span class="drip drip-1"></span>
                        <span class="drip drip-2"></span>
                        <span class="drip drip-3"></span>
                        <span class="drip drip-4"></span>
                        <span class="drip drip-5"></span>

                    </div>



                    <!-- CAKE -->

                    <div class="cake-layer cake-bottom"></div>

                    <div class="cake-layer cake-middle"></div>

                    <div class="cake-layer cake-upper"></div>



                    <!-- PLATE -->

                    <div class="cake-plate"></div>


                </div>

            </div>



            <!-- WISH TEXT -->

            <div class="wish-area">

                <h2>
                    Make a wish.
                </h2>

                <p>
                    Then blow out the candles.
                </p>

            </div>



            <!-- BUTTON -->

            <button
                id="blowButton"
                class="main-button blow-button"
            >
                Blow Out The Candles
            </button>


        </div>

    </section>



    <!-- =========================================
         FIREWORK CANVAS
         ========================================= -->

    <canvas
        id="fireworksCanvas"
    ></canvas>



    <!-- =========================================
         FINAL MESSAGE
         ========================================= -->

    <section
        id="finalMessage"
        class="final-message"
    >

        <div class="final-content">

            <p class="final-small">
                TONIGHT IS YOUR NIGHT
            </p>

            <h2>
                Happy Birthday!
            </h2>

            <p class="final-text">
                May this year be filled with
                amazing memories, happiness,
                and moments worth remembering.
            </p>


            <!-- =========================================
                 CLICKABLE LINK
                 ========================================= -->

            <a
                href="https://happiepages.com/view/hbd/6a845d9e2c5410207b5f4473-eebe"
                target="_blank"
                rel="noopener noreferrer"
                class="main-button surprise-link"
>
                Open Your Surprise 💌
            </a>


        </div>

    </section>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
